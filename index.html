<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gástulo | Constructores y Asesores</title>
    <style>
        /* BASE Y COLORES */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #0a0a0a; color: #ffffff; }
        .gold-text { color: #C5A059; }
        
        /* HEADER / NAV */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #111; border-bottom: 2px solid #C5A059; }
        .logo-main img { height: 50px; }
        nav a { color: #fff; margin-left: 30px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        nav a:hover { color: #C5A059; }

        /* HERO */
        .hero { height: 80vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero h1 { font-size: 3rem; text-transform: uppercase; margin: 0; }

        /* SECCIONES */
        .container { padding: 80px 8%; }
        .contacto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
        
        /* FORMULARIO */
        .form-box { border: 1px solid #C5A059; padding: 40px; }
        input, textarea { width: 100%; background: #1a1a1a; border: 1px solid #C5A059; padding: 12px; margin-bottom: 15px; color: white; box-sizing: border-box; }
        button { background: #C5A059; color: black; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; }

        /* FOOTER */
        footer { background: #050505; padding: 50px 8%; border-top: 1px solid #333; }
        .footer-content { display: flex; justify-content: space-between; align-items: flex-start; }
        .grupo-logos { display: flex; gap: 20px; align-items: center; margin-top: 20px; }
        .logo-pequeno { width: 100px; height: auto; filter: grayscale(20%); transition: 0.3s; }
        .logo-pequeno:hover { filter: grayscale(0%); transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <div class="logo-main"><img src="gastulo.png" alt="Logo"></div>
        <nav>
            <a href="#">INICIO</a>
            <a href="#">NOSOTROS</a>
            <a href="#">SERVICIOS</a>
            <a href="#">CONTÁCTANOS</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Innovación constante,</h1>
            <h1 class="gold-text">Resultados excepcionales</h1>
        </div>
    </section>

    <section class="container contacto-grid">
        <div class="mapa">
            <iframe src="https://www.google.com/maps/embed?..." width="100%" height="400" style="border:0;" allowfullscreen></iframe>
        </div>
        <div class="form-box">
            <h2>Contáctanos</h2>
            <input type="text" placeholder="Nombre y Apellido">
            <input type="text" placeholder="Teléfono">
            <input type="email" placeholder="Correo">
            <textarea rows="4" placeholder="Mensaje"></textarea>
            <button>ENVIAR</button>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div>
                <h4>CONTÁCTENOS</h4>
                <p>📍 Calle Teruel N° 370, Miraflores, Lima.</p>
                <p>📞 +51 939 846 545</p>
                <p>✉️ jlabogados.legal@gmail.com</p>
                
                <p style="margin-top:20px; font-size: 0.8rem; color: #888;">Conoce nuestras otras empresas:</p>
                <div class="grupo-logos">
                    <a href="https://gastulo.pe"><img src="gastulo.png" class="logo-pequeno"></a>
                    <a href="https://jl2.pe"><img src="jl2.png" class="logo-pequeno"></a>
                    <a href="https://fedas.pe"><img src="fedas.png" class="logo-pequeno"></a>
                </div>
            </div>
        </div>
        <p style="text-align: center; margin-top: 40px; color: #444; font-size: 0.8rem;">© Copyright 2026 | Gástulo Asesores y Constructores</p>
    </footer>

</body>
</html>
